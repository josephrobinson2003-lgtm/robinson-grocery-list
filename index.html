<style>
  :root { --green:#1f6f43; --bg:#f4f6f3; --card:#fff; --muted:#6b7280; --line:#e5e7eb; --est:#b45309; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:#111; font-size:17px; }
  header { position:sticky; top:0; z-index:5; background:var(--green); color:#fff; padding:14px 16px 10px; padding-top:calc(14px + env(safe-area-inset-top)); box-shadow:0 2px 6px rgba(0,0,0,.15); }
  h1 { margin:0; font-size:22px; }
  .range { font-size:14px; opacity:.9; margin-top:2px; }
  .bar { display:flex; gap:6px; align-items:center; margin-top:8px; }
  .bar button { padding:8px 10px; font-size:14px; min-height:40px; white-space:nowrap; }
  .count { font-weight:700; font-size:14px; margin-right:auto; white-space:nowrap; }
  button { font:inherit; font-size:15px; border:0; border-radius:10px; padding:10px 14px; min-height:44px; cursor:pointer; }
  .btn-light { background:rgba(255,255,255,.18); color:#fff; }
  .btn-light.on { background:#fff; color:var(--green); font-weight:700; }
  .tabs { display:flex; gap:6px; margin-top:10px; }
  .tabs button { flex:1; background:rgba(255,255,255,.18); color:#fff; padding:10px 6px; }
  .tabs button.on { background:#fff; color:var(--green); font-weight:700; }
  main { padding:12px 12px 90px; max-width:720px; margin:0 auto; }
  .legend { font-size:13px; color:var(--muted); margin:4px 4px 10px; }
  .sec h2 { font-size:19px; margin:18px 4px 4px; color:var(--green); }
  .sub { font-size:13px; color:var(--muted); margin:0 4px 8px; }
  .grp { background:var(--card); border-radius:14px; margin:10px 0; overflow:hidden; box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .grp h3 { margin:0; padding:10px 14px; font-size:14px; text-transform:uppercase; letter-spacing:.04em; background:#eef4ef; color:#24543a; display:flex; justify-content:space-between; }
  .item { display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border-top:1px solid var(--line); min-height:56px; cursor:pointer; user-select:none; }
  .box { flex:0 0 26px; height:26px; border:2px solid #9ca3af; border-radius:7px; margin-top:1px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:18px; }
  .item.done .box { background:var(--green); border-color:var(--green); }
  .txt { flex:1; min-width:0; }
  .name { font-weight:600; line-height:1.25; }
  .qty { color:#374151; font-size:15px; }
  .meal { color:var(--muted); font-size:13px; margin-top:2px; }
  .loc { color:#1f6f43; font-size:12px; margin-top:2px; }
  .est { color:var(--est); font-size:12px; font-weight:700; margin-left:4px; white-space:nowrap; }
  .item.done .name, .item.done .qty { text-decoration:line-through; color:#9ca3af; }
  .item.done .meal { opacity:.6; }
  .hide-done .item.done { display:none; }
  footer { text-align:center; color:var(--muted); font-size:12px; padding:20px; }
</style>
</head>
<body>
<header>
  <h1>Robinson Grocery List</h1>
  <div class="range" id="range"></div>
  <div class="tabs" id="tabs"></div>
  <div class="bar">
    <span class="count" id="count"></span>
    <button class="btn-light" id="installBtn" hidden>Install</button>
    <button class="btn-light" id="hideBtn">Hide ✓</button>
    <button class="btn-light" id="uncheckBtn">Uncheck all</button>
    <button class="btn-light" id="resetBtn">Reset</button>
  </div>
</header>
<main id="main"></main>
<footer id="foot"></footer>

<script>
(function(){
  var data = JSON.parse(document.getElementById('grocery-data').textContent);
  var KEY = 'robinson-grocery:' + data.weekId;
  var UIKEY = 'robinson-grocery-ui';
  // drop saved state from older weeks so a new list starts fresh
  try { Object.keys(localStorage).forEach(function(k){ if(k.indexOf('robinson-grocery:')===0 && k!==KEY) localStorage.removeItem(k); }); } catch(e){}
  var state = {}; try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){}
  var ui = {}; try { ui = JSON.parse(localStorage.getItem(UIKEY)) || {}; } catch(e){}
  if (!ui.tab || (ui.tab!=='all' && !data.sections.some(function(s){ return s.id===ui.tab; }))) ui.tab = 'all';
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); localStorage.setItem(UIKEY, JSON.stringify(ui)); } catch(e){} }
  function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }
  function el(t,c,txt){ var e=document.createElement(t); if(c) e.className=c; if(txt!=null) e.textContent=txt; return e; }

  document.getElementById('range').textContent = data.range + (data.store ? ' · ' + data.store.name + ', ' + data.store.address.split(',')[0] : '');
  document.getElementById('foot').textContent = 'Updated ' + data.updated + ' · from the Family calendar menu' + (data.store ? ' · in aisle order for ' + data.store.name + ' (' + data.store.address + ')' : '');

  var tabs = document.getElementById('tabs');
  var tabDefs = [{id:'all', name:'All'}].concat(data.sections.map(function(s){ return {id:s.id, name:s.name.replace(/\s*\(.*\)/,'')}; }));
  tabDefs.forEach(function(t){
    var b = el('button', null, t.name); b.dataset.tab = t.id;
    b.onclick = function(){ ui.tab = t.id; save(); render(); };
    tabs.appendChild(b);
  });

  var main = document.getElementById('main');
  function render(){
    [].forEach.call(tabs.children, function(b){ b.classList.toggle('on', b.dataset.tab===ui.tab); });
    document.getElementById('hideBtn').classList.toggle('on', !!ui.hide);
    main.classList.toggle('hide-done', !!ui.hide);
    main.innerHTML = '';
    if (data.legend) main.appendChild(el('div','legend',data.legend));
    var total=0, left=0;
    data.sections.forEach(function(sec){
      var visible = ui.tab==='all' || ui.tab===sec.id;
      var sdiv = el('section','sec');
      sdiv.appendChild(el('h2',null,sec.name));
      if (sec.subtitle) sdiv.appendChild(el('p','sub',sec.subtitle));
      sec.groups.forEach(function(g){
        if (!g.items || !g.items.length) return;
        var gdiv = el('div','grp'); var h = el('h3'); h.appendChild(el('span',null,g.name));
        var gleft = el('span'); h.appendChild(gleft); gdiv.appendChild(h);
        var gl=0;
        g.items.forEach(function(it){
          var id = it.id || (sec.id + '|' + slug(g.name) + '|' + slug(it.n));
          var done = !!state[id];
          if (visible){ total++; if(!done){ left++; gl++; } }
          var row = el('div','item'+(done?' done':''));
          var box = el('div','box', done?'✓':'');
          var t = el('div','txt');
          var nm = el('div','name', it.n);
          if (it.e) nm.appendChild(el('span','est','★ est.'));
          t.appendChild(nm);
          if (it.q) t.appendChild(el('div','qty', it.q));
          if (it.m) t.appendChild(el('div','meal', it.m));
          if (it.loc && it.loc !== g.short) t.appendChild(el('div','loc', '📍 ' + it.loc));
          row.appendChild(box); row.appendChild(t);
          row.onclick = function(){ if(state[id]) delete state[id]; else state[id]=1; save(); render(); };
          gdiv.appendChild(row);
        });
        gleft.textContent = gl ? gl + ' left' : 'done ✓';
        sdiv.appendChild(gdiv);
      });
      if (visible) main.appendChild(sdiv);
    });
    document.getElementById('count').textContent = left + ' of ' + total + ' left';
  }
  document.getElementById('hideBtn').onclick = function(){ ui.hide = !ui.hide; save(); render(); };
  document.getElementById('uncheckBtn').onclick = function(){ if(confirm('Uncheck every item?')){ state = {}; save(); render(); } };
  document.getElementById('resetBtn').onclick = function(){ if(confirm('Reset the list (uncheck all, show all items, back to All tab)?')){ state={}; ui={tab:'all'}; save(); render(); window.scrollTo(0,0); } };
  render();

  // Install button (Android Chrome) + service worker for offline use
  var deferred = null, ib = document.getElementById('installBtn');
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferred = e; ib.hidden = false; });
  ib.onclick = function(){ if(!deferred) return; deferred.prompt(); deferred.userChoice.finally(function(){ deferred = null; ib.hidden = true; }); };
  window.addEventListener('appinstalled', function(){ ib.hidden = true; });
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function(){}); });
  }
})();
</script>
</body>
